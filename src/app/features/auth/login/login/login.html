<div class="min-vh-100 d-flex align-items-center justify-content-center bg-light">
  <div class="card shadow p-4" style="width: 100%; max-width: 420px;">
    <div class="card-body">

      <h3 class="text-center fw-bold mb-1">Welcome back</h3>
      <p class="text-center text-muted mb-4">Sign in to your account</p>

      <form [formGroup]="logInForm" (submit)="onSubmit()">

        <div class="mb-3">
          <label class="form-label fw-semibold">Email Address</label>
          <input type="email" class="form-control" placeholder="you@example.com" formControlName="email"/>
        </div>

        <div class="mb-3">
          <div class="d-flex justify-content-between">
            <label class="form-label fw-semibold">Password</label>
            <a href="#" class="small text-primary">Forgot password?</a>
          </div>
          <input type="password" class="form-control" placeholder="••••••••" formControlName="password"/>
        </div>

        <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">Sign In</button>

      </form>

      <p class="text-center text-muted small mt-3 mb-0">
        Don't have an account? <a href="#" class="text-primary fw-semibold">Create one</a>
      </p>

    </div>
  </div>
</div>
